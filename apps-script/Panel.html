<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soporte · Control en vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0B0B0C;
  --surface: #111113;
  --raised: #18181B;
  --line: #232327;
  --line-2: #33333A;
  --text: #F2F2F3;
  --text-2: #A6A6AE;
  --text-3: #85858E;
  --ok: #5BC79A;
  --warn: #E2B340;
  --bad: #F2716B;
  --r: 6px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif; font-size: 13px; line-height: 1.45; font-weight: 500;
  font-feature-settings: 'tnum' 1, 'lnum' 1; -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.pagina { max-width: 1680px; margin: 0 auto; padding: 0 28px 48px; }
.num { text-align: right; white-space: nowrap; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .tenue { color: var(--text-2); }

/* Cabecera */
.cab { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.cab-in { max-width: 1680px; margin: 0 auto; padding: 0 28px; min-height: 60px; display: flex; align-items: center; gap: 12px 24px; flex-wrap: wrap; }
.marca { display: flex; align-items: baseline; gap: 12px; margin-right: auto; padding: 14px 0; }
.marca b { font-size: 15px; font-weight: 700; letter-spacing: .01em; }
.marca span { font-size: 13px; color: var(--text-2); padding-left: 12px; border-left: 1px solid var(--line-2); }
.estado-con { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.estado-con i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.hora { text-align: right; line-height: 1.25; }
.hora b { display: block; font-size: 17px; font-weight: 600; letter-spacing: .02em; }
.hora span { font-size: 11.5px; color: var(--text-2); }
.btn { height: 36px; padding: 0 14px; border-radius: var(--r); border: 1px solid var(--line-2); background: transparent; font-weight: 600; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--raised); }
.btn.principal { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn.principal:hover { background: #D9D9DC; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.chico { height: 28px; padding: 0 10px; font-size: 11.5px; }
.avance { height: 1px; }
.avance i { display: block; height: 1px; width: 0; background: var(--text-3); transition: width 1s linear; }

.aviso { margin-top: 16px; padding: 10px 14px; border-radius: var(--r); font-size: 12.5px; border: 1px solid var(--line-2); border-left: 3px solid var(--warn); background: var(--surface); }
.aviso.error { border-left-color: var(--bad); }

.seccion { margin-top: 32px; }
.seccion-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.seccion-cab h2 { margin: 0; font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.seccion-cab p { margin: 0; font-size: 12px; color: var(--text-2); }

/* Indicadores */
.indicadores { margin-top: 24px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.ind { padding: 16px 18px 15px; border-left: 1px solid var(--line); min-width: 0; }
.ind:first-child { border-left: 0; }
.ind .l { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-2); }
.ind .v { font-size: clamp(22px, 1.9vw, 30px); font-weight: 600; letter-spacing: -.02em; line-height: 1.25; margin-top: 6px; white-space: nowrap; }
.ind .n { font-size: 12px; color: var(--text-2); margin-top: 2px; }
@media (max-width: 1100px) { .indicadores { grid-template-columns: repeat(3, minmax(0, 1fr)); } .ind:nth-child(4) { border-left: 0; } .ind:nth-child(n+4) { border-top: 1px solid var(--line); } }
@media (max-width: 620px) { .indicadores { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ind { border-top: 1px solid var(--line); } .ind:nth-child(-n+2) { border-top: 0; } .ind:nth-child(odd) { border-left: 0; } .ind:nth-child(even) { border-left: 1px solid var(--line); } }

/* Tablas */
.caja { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.desliza { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-2); text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td, tfoot td { border-bottom: 0; }
tfoot td { border-top: 1px solid var(--line-2); font-weight: 600; background: var(--raised); }
th.num { text-align: right; }
.t-agentes { min-width: 1120px; }
.t-agentes th, .t-agentes td { padding-left: 9px; padding-right: 9px; }
.t-agentes th:first-child, .t-agentes td:first-child { padding-left: 16px; }
.t-agentes tbody tr { cursor: pointer; }
.t-agentes tbody tr:hover td { background: var(--raised); }
.t-agentes tbody tr.sel td { background: var(--raised); }
.t-agentes tbody tr.sel td:first-child { box-shadow: inset 2px 0 0 var(--text); }
.t-agentes td.fuerte { font-size: 15px; font-weight: 600; }
.nombre { font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.est { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 600; white-space: nowrap; margin-top: 3px; }
.est i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.grupo-izq { border-left: 1px solid var(--line); }

/* Pestañas */
.pestanas { display: flex; gap: 22px; padding: 0 16px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.pest { background: none; border: 0; padding: 13px 0 12px; font-size: 12.5px; font-weight: 600; color: var(--text-2); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.pest:hover { color: var(--text); }
.pest.sel { color: var(--text); border-bottom-color: var(--text); }
.pest span { color: var(--text-3); font-weight: 500; margin-left: 5px; }
.t-cola { min-width: 760px; }
.t-cola tbody tr:hover td { background: var(--raised); }
.espera { font-weight: 600; font-size: 13px; white-space: nowrap; }
.barra { display: block; width: 84px; height: 2px; background: var(--line-2); margin-top: 5px; }
.barra i { display: block; height: 2px; background: currentColor; }
.asunto { max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vacio { padding: 28px 16px; text-align: center; color: var(--text-2); }

.dos { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.dos > .col-a { flex: 999 1 720px; min-width: 0; }
.dos > .col-b { flex: 1 1 380px; min-width: 0; }

/* Registro */
.registro { list-style: none; margin: 0; padding: 0; max-height: 620px; overflow-y: auto; }
.registro li { display: grid; grid-template-columns: 48px 96px minmax(0, 1fr); gap: 10px; padding: 9px 16px; border-bottom: 1px solid var(--line); align-items: baseline; }
.registro li:last-child { border-bottom: 0; }
.registro time { color: var(--text-2); font-size: 12px; }
.registro .tipo { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
.registro .txt { min-width: 0; }
.registro .txt small { display: block; color: var(--text-2); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.pie { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--text-2); display: flex; justify-content: space-between; gap: 8px 24px; flex-wrap: wrap; }
.cargando { color: var(--text-2); padding: 80px 0; text-align: center; }

/* Diálogos */
dialog { border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); color: var(--text); padding: 0; width: min(1120px, calc(100vw - 32px)); max-height: calc(100vh - 32px); box-shadow: 0 24px 80px rgba(0, 0, 0, .6); }
dialog::backdrop { background: rgba(0, 0, 0, .66); }
.dlg-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.dlg-cab h3 { margin: 0; font-size: 15px; font-weight: 700; }
.dlg-cab p { margin: 2px 0 0; font-size: 12px; color: var(--text-2); }
.dlg-cuerpo { padding: 20px; }
.filtros { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px 28px; }
.campo > label, .campo > .rot { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); margin-bottom: 8px; }
.campo input[type=date], .campo select { height: 36px; padding: 0 10px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--bg); color-scheme: dark; width: 100%; }
.fechas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.fechas span { display: block; font-size: 11px; color: var(--text-2); margin-bottom: 3px; }
.checks { display: flex; flex-direction: column; gap: 2px; }
.checks label { display: flex; align-items: center; gap: 9px; min-height: 28px; font-size: 13px; cursor: pointer; }
.checks input { width: 15px; height: 15px; accent-color: #F2F2F3; }
.acciones { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
.acciones .nota { font-size: 12px; color: var(--text-2); margin-left: auto; }
.previa { margin-top: 20px; }
.previa h4 { margin: 0 0 8px; font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.previa table { min-width: 980px; }
.resumen-dlg { display: flex; gap: 28px; flex-wrap: wrap; margin-bottom: 18px; }
.resumen-dlg div b { display: block; font-size: 20px; font-weight: 600; }
.resumen-dlg div span { font-size: 11px; color: var(--text-2); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }

@media (max-width: 640px) {
  .pagina, .cab-in { padding-left: 16px; padding-right: 16px; }
  .marca span { display: none; }
  .hora { text-align: left; }
  .registro li { grid-template-columns: 44px 92px minmax(0, 1fr); padding: 9px 12px; }
}
</style>
</head>
<body>
<header class="cab">
  <div class="cab-in">
    <div class="marca"><b>Soporte</b><span>Control en vivo · Help Scout</span></div>
    <span id="conexion" class="estado-con tenue"><i></i><span>Conectando</span></span>
    <div class="hora"><b id="reloj">--:--:--</b><span id="actualizado">Cargando</span></div>
    <button type="button" class="btn" id="btnPausa" aria-pressed="false">Pausar</button>
    <button type="button" class="btn principal" id="btnExportar">Exportar métricas</button>
  </div>
  <div class="avance"><i id="avance"></i></div>
</header>

<main class="pagina">
  <div id="avisos"></div>
  <div id="contenido"><div class="cargando">Leyendo Help Scout. La primera carga puede tardar hasta un minuto.</div></div>
</main>

<dialog id="dlgExportar" aria-labelledby="tituloExportar">
  <div class="dlg-cab">
    <div><h3 id="tituloExportar">Exportar métricas</h3><p id="subExportar">Datos del historial del tracker (hoja HS_Eventos).</p></div>
    <button type="button" class="btn chico" data-cerrar>Cerrar</button>
  </div>
  <div class="dlg-cuerpo">
    <div class="filtros">
      <div class="campo">
        <label for="expPeriodo">Periodo</label>
        <select id="expPeriodo">
          <option value="hoy">Hoy</option>
          <option value="ayer">Ayer</option>
          <option value="semana" selected>Esta semana</option>
          <option value="semanaPasada">Semana pasada</option>
          <option value="mes">Este mes</option>
          <option value="mesPasado">Mes pasado</option>
          <option value="todo">Todo el historial</option>
          <option value="personal">Personalizado</option>
        </select>
        <div class="fechas">
          <div><span>Desde</span><input type="date" id="expDesde" aria-label="Desde"></div>
          <div><span>Hasta</span><input type="date" id="expHasta" aria-label="Hasta"></div>
        </div>
      </div>
      <div class="campo">
        <span class="rot">Agentes</span>
        <div class="checks" id="expAgentes"></div>
      </div>
      <div class="campo">
        <span class="rot">Movimientos en la hoja de detalle</span>
        <div class="checks" id="expTipos">
          <label><input type="checkbox" value="ASIGNADO" checked> Asignados</label>
          <label><input type="checkbox" value="RESPUESTA" checked> Respuestas</label>
          <label><input type="checkbox" value="PRIMERA_RESPUESTA" checked> Primeras respuestas</label>
          <label><input type="checkbox" value="NUEVA_CONSULTA" checked> Nuevas consultas</label>
          <label><input type="checkbox" value="REASIGNADO" checked> Re-asignados</label>
          <label><input type="checkbox" value="CERRADO" checked> Cerrados</label>
        </div>
      </div>
    </div>
    <div class="acciones">
      <button type="button" class="btn" id="expVer">Ver vista previa</button>
      <button type="button" class="btn principal" id="expExcel">Descargar Excel</button>
      <select id="expCsvHoja" aria-label="Hoja para CSV" style="height:36px;padding:0 10px;border-radius:6px;border:1px solid var(--line-2);background:var(--bg);color-scheme:dark">
        <option value="agentes">CSV · Resumen por agente</option>
        <option value="dias">CSV · Por día</option>
        <option value="detalle">CSV · Detalle de movimientos</option>
      </select>
      <button type="button" class="btn" id="expCsv">Descargar CSV</button>
      <span class="nota" id="expEstado" role="status"></span>
    </div>
    <div class="previa" id="expPrevia"></div>
  </div>
</dialog>

<dialog id="dlgDetalle" aria-labelledby="tituloDetalle">
  <div class="dlg-cab">
    <div><h3 id="tituloDetalle">Detalle</h3><p id="subDetalle"></p></div>
    <button type="button" class="btn chico" data-cerrar>Cerrar</button>
  </div>
  <div class="dlg-cuerpo" id="cuerpoDetalle"></div>
</dialog>

<script>
(function () {
  'use strict';
  var datos = null, desfase = 0, filtro = 'todos', pausado = false, enCurso = false, ultimaOk = 0, proxima = 0, temporizador = null;
  var demo = typeof google === 'undefined' || !google.script || !google.script.run;
  var reporte = null;

  var $ = function (id) { return document.getElementById(id); };
  var todos = function (sel, raiz) { return Array.prototype.slice.call((raiz || document).querySelectorAll(sel)); };
  var ahora = function () { return Date.now() + desfase; };
  var esc = function (t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var p2 = function (n) { return (n < 10 ? '0' : '') + n; };
  function dur(seg) {
    seg = Math.max(0, Math.floor(seg));
    var d = Math.floor(seg / 86400), h = Math.floor(seg % 86400 / 3600), m = Math.floor(seg % 3600 / 60), s = seg % 60;
    if (d) return d + ' d ' + p2(h) + ':' + p2(m) + ':' + p2(s);
    return p2(h) + ':' + p2(m) + ':' + p2(s);
  }
  function corto(seg) {
    seg = Math.max(0, Math.floor(seg));
    if (seg < 60) return seg + ' s';
    if (seg < 3600) return Math.floor(seg / 60) + ' min';
    if (seg < 86400) return Math.floor(seg / 3600) + ' h ' + p2(Math.floor(seg % 3600 / 60)) + ' min';
    return Math.floor(seg / 86400) + ' d ' + Math.floor(seg % 86400 / 3600) + ' h';
  }
  function minTxt(m) {
    if (m == null) return '—';
    if (m < 60) return (Math.round(m * 10) / 10).toLocaleString('es') + ' min';
    return Math.floor(m / 60) + ' h ' + p2(Math.round(m % 60)) + ' min';
  }
  function tz() { return (datos && datos.tz) || 'America/New_York'; }
  function hora(ms, seg) {
    var o = { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: tz() };
    if (seg) o.second = '2-digit';
    try { return new Date(ms).toLocaleTimeString('es', o); } catch (e) { return new Date(ms).toTimeString().slice(0, seg ? 8 : 5); }
  }
  function tono(min) {
    var meta = (datos && datos.metaRespuestaMin) || 60;
    return min < meta / 2 ? 'ok' : min < meta ? 'warn' : 'bad';
  }
  function servidor(fn, arg, listo) {
    if (demo) { setTimeout(function () { listo(JSON.stringify(DEMO[fn](arg))); }, 250); return; }
    var corre = google.script.run
      .withSuccessHandler(listo)
      .withFailureHandler(function (err) { listo(JSON.stringify({ ok: false, error: String(err && err.message || err) })); });
    if (arg === undefined) corre[fn](); else corre[fn](arg);
  }
  function leer(texto) { try { return JSON.parse(texto); } catch (e) { return { ok: false, error: 'Respuesta no válida del servidor.' }; } }

  // ---------- Datos en vivo ----------
  function pedir() {
    if (enCurso || pausado) return;
    enCurso = true;
    servidor('datosPanelEnVivo', undefined, function (texto) { enCurso = false; recibir(leer(texto)); programar(); });
  }
  function intervalo() {
    if (!datos) return 10;
    return datos.enHorario ? (datos.segundos || 5) : (datos.segundosFueraDeHorario || 60);
  }
  function programar() {
    clearTimeout(temporizador);
    if (pausado) return;
    var s = intervalo();
    proxima = Date.now() + s * 1000;
    temporizador = setTimeout(pedir, s * 1000);
  }
  var errorActual = '';
  function recibir(r) {
    if (!r.ok) {
      errorActual = r.error || 'Error desconocido';
      pintarAvisos();
      if (!datos) $('contenido').innerHTML = '<div class="cargando">Sin datos todavía. Reintentando.</div>';
      return;
    }
    errorActual = '';
    desfase = Date.parse(r.ahora) - Date.now();
    datos = r;
    ultimaOk = Date.now();
    pintarAvisos();
    pintar();
  }
  function pintarAvisos() {
    var h = '';
    if (errorActual) {
      h += '<div class="aviso error" role="alert"><b>No se pudo leer Help Scout.</b> ' + esc(errorActual) +
        (datos ? ' Se muestran los últimos datos recibidos (' + hora(ultimaOk + desfase, true) + ').' : '') + '</div>';
    }
    if (datos && datos.verificacion && !datos.verificacion.ok) {
      h += '<div class="aviso error" role="alert"><b>La lectura no cuadra con Help Scout.</b> ' + esc(datos.verificacion.avisos.join(' · ')) + '</div>';
    }
    if (datos && datos.sinVincular && datos.sinVincular.length) {
      h += '<div class="aviso">No encontré en Help Scout a: ' + esc(datos.sinVincular.join(', ')) + '. Revisa su email en la configuración (AGENTES).</div>';
    }
    if (demo) h += '<div class="aviso">Vista de demostración con datos de ejemplo. Los datos reales aparecen al abrir la página publicada desde Apps Script.</div>';
    $('avisos').innerHTML = h;
  }

  // ---------- Pintado ----------
  function reloj(desde, clases, extra) {
    return '<span class="reloj ' + (clases || '') + '" data-desde="' + esc(desde) + '"' + (extra || '') + '>' + dur((ahora() - Date.parse(desde)) / 1000) + '</span>';
  }
  function ind(l, v, n) { return '<div class="ind"><div class="l">' + esc(l) + '</div><div class="v">' + v + '</div><div class="n">' + esc(n) + '</div></div>'; }

  function pintar() {
    var p = datos.panel, e = p.equipo, viejo = null;
    p.agentes.forEach(function (a) { if (a.esperando.length && (!viejo || a.esperando[0].esperaDesde < viejo)) viejo = a.esperando[0].esperaDesde; });
    var h = '';
    h += '<section class="indicadores" aria-label="Indicadores del equipo">' +
      ind('Clientes esperando', e.esperando, e.abiertos + ' casos abiertos · ' + e.seguimiento + ' en seguimiento') +
      ind('Mayor espera', viejo ? reloj(viejo, '', ' data-tono="1"') : '—', viejo ? 'reloj en vivo · hh:mm:ss' : 'nadie esperando') +
      ind('Respuestas hoy', e.respuestas, 'en ' + e.casosRespondidos + ' casos') +
      ind('Cerrados hoy', e.cerrados, e.asignados + ' asignados · ' + e.reasignados + ' re-asignados') +
      ind('Tiempo de respuesta', minTxt(e.promedioRespuestaMin), 'promedio · mediana ' + minTxt(e.medianaRespuestaMin)) +
      ind('Sin asignar', p.sinAsignar.length, p.sinAsignar.length ? 'con el cliente esperando' : 'cola vacía') +
      '</section>';

    h += '<section class="seccion"><div class="seccion-cab"><h2>Agentes</h2><p>Jornada del ' + esc(diaLargo(datos.hoy)) +
      ' · clic en una fila para filtrar la cola</p></div><div class="caja"><div class="desliza"><table class="t-agentes">' +

  function pintarCola() {
    var p = datos.panel, filas = [];
    p.agentes.forEach(function (a) { a.esperando.forEach(function (t) { filas.push(t); }); });

      h += '<div class="desliza"><table class="t-cola"><thead><tr><th>Espera</th><th>Caso</th><th>Asunto</th><th>Cliente</th><th>Agente</th><th>Estado en Help Scout</th></tr></thead><tbody>' +
        visibles.map(function (t) {

  var TIPOS = {
    RESPUESTA: ['Respuesta', 'ok'], CLIENTE: ['Cliente', 'warn'], ASIGNADO: ['Asignado', ''], CERRADO: ['Cerrado', 'ok'],
    REASIGNADO: ['Re-asignado', 'tenue'], NUEVA_CONSULTA: ['Consulta', 'warn'], PRIMERA_RESPUESTA: ['1ª respuesta', 'ok'],

  function textoMovimiento(f) {

  // ---------- Cada segundo ----------
  function conexion(clase, texto) {
    var el = $('conexion');
    el.className = 'estado-con ' + clase;
    el.lastElementChild.textContent = texto;
  }
  function tic() {
    var t = ahora();
    $('reloj').textContent = hora(t, true);
    if (!datos) { if (errorActual) conexion('bad', 'Sin conexión'); return; }
    var hace = Math.max(0, Math.floor((Date.now() - ultimaOk) / 1000));
    var atrasado = hace > Math.max(30, intervalo() * 4);
    $('actualizado').textContent = pausado ? 'En pausa · datos de hace ' + corto(hace)
      : 'Actualizado hace ' + corto(hace) + ' · cada ' + intervalo() + ' s';
    if (pausado) conexion('warn', 'En pausa');
    else if (errorActual || atrasado) conexion('bad', 'Sin conexión');
    else if (!datos.enHorario) conexion('tenue', 'Fuera de horario');
    else conexion('ok', 'En vivo');
    $('avance').style.width = pausado ? '0' : Math.min(100, Math.max(0, 100 - (proxima - Date.now()) / (intervalo() * 1000) * 100)) + '%';

    var meta = datos.metaRespuestaMin || 60;
    todos('.reloj[data-desde]').forEach(function (el) {
      var seg = (t - Date.parse(el.getAttribute('data-desde'))) / 1000;
      el.textContent = el.getAttribute('data-corto') ? corto(seg) : dur(seg);
      if (el.getAttribute('data-tono')) {
        var c = tono(seg / 60);
        el.classList.remove('ok', 'warn', 'bad');
        el.classList.add(c);
        if (el.getAttribute('data-barra')) {
          var b = el.parentNode.querySelector('.barra');
          b.className = 'barra ' + c;
          b.firstChild.style.width = Math.min(100, seg / 60 / meta * 100) + '%';
        }
      }
    });
    var alerta = datos.alertaSinResponderMin || [10, 30];
    todos('.est[data-esperando]').forEach(function (el) {
      var esperando = Number(el.getAttribute('data-esperando')), ultima = el.getAttribute('data-ultima');
      var min = ultima ? (t - Date.parse(ultima)) / 60000 : Infinity, clase, texto;
      if (!esperando) { clase = 'ok'; texto = 'Al día'; }
      else if (!datos.enHorario) { clase = 'tenue'; texto = 'Fuera de horario'; }
      else if (min < alerta[0]) { clase = 'ok'; texto = 'Respondiendo'; }
      else if (min < alerta[1]) { clase = 'warn'; texto = 'Sin responder ' + Math.floor(min) + ' min'; }
      else { clase = 'bad'; texto = ultima ? 'Sin responder ' + corto(min * 60) : 'Sin responder hoy'; }
      el.className = 'est ' + clase;
      el.lastElementChild.textContent = texto;
    });
  }

  // ---------- Detalle de una agente ----------

        (d.abiertos.map(function (x) {

        }).join('') || '<tr><td colspan="5" class="vacio">Sin casos abiertos.</td></tr>') + '</tbody></table></div></div></div>';

        (d.movimientos.map(function (m) {

  // ---------- Exportar ----------
  function hoyLocal() {
    try { return new Intl.DateTimeFormat('en-CA', { timeZone: tz(), year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(ahora())); }
    catch (e) { return new Date(ahora()).toISOString().slice(0, 10); }
  }
  function sumarDias(d, n) { var f = new Date(d + 'T12:00:00Z'); f.setUTCDate(f.getUTCDate() + n); return f.toISOString().slice(0, 10); }
  function rango(tipo) {
    var hoy = hoyLocal(), f = new Date(hoy + 'T12:00:00Z'), lunes = sumarDias(hoy, -((f.getUTCDay() + 6) % 7));
    var mes1 = hoy.slice(0, 8) + '01';
    if (tipo === 'hoy') return [hoy, hoy];
    if (tipo === 'ayer') return [sumarDias(hoy, -1), sumarDias(hoy, -1)];
    if (tipo === 'semana') return [lunes, hoy];
    if (tipo === 'semanaPasada') return [sumarDias(lunes, -7), sumarDias(lunes, -1)];
    if (tipo === 'mes') return [mes1, hoy];
    if (tipo === 'mesPasado') { var fin = sumarDias(mes1, -1); return [fin.slice(0, 8) + '01', fin]; }
    if (tipo === 'todo') return [(datos && datos.fechaInicio) || '2026-01-01', hoy];
    return null;
  }
  function aplicarPeriodo() {
    var r = rango($('expPeriodo').value);
    if (r) { $('expDesde').value = r[0]; $('expHasta').value = r[1]; }
  }
  function filtrosExportar() {
    return {
      desde: $('expDesde').value, hasta: $('expHasta').value,
      agentes: todos('#expAgentes input:checked').map(function (i) { return i.value; }),
      tipos: todos('#expTipos input:checked').map(function (i) { return i.value; }),
    };
  }
  function abrirExportar() {
    var nombres = (datos && datos.agentes) || [];
    if (!$('expAgentes').children.length) {
      $('expAgentes').innerHTML = nombres.map(function (n) { return '<label><input type="checkbox" value="' + esc(n) + '" checked> ' + esc(n) + '</label>'; }).join('');
      if (datos && datos.fechaInicio) { $('expDesde').min = datos.fechaInicio; $('expHasta').min = datos.fechaInicio; }
      aplicarPeriodo();
    }
    $('expPrevia').innerHTML = '';

    $('dlgExportar').showModal();
  }
  function pedirReporte(despues) {
    var f = filtrosExportar();
    if (!f.desde || !f.hasta || f.desde > f.hasta) { $('expEstado').textContent = 'Revisa las fechas.'; return; }
    if (!f.agentes.length) { $('expEstado').textContent = 'Elige al menos una agente.'; return; }
    $('expEstado').textContent = 'Calculando.';
    ['expVer', 'expExcel', 'expCsv'].forEach(function (id) { $(id).disabled = true; });
    servidor('reporteMetricas', f, function (texto) {
      ['expVer', 'expExcel', 'expCsv'].forEach(function (id) { $(id).disabled = false; });

      reporte = r;
      $('expEstado').textContent = r.porDia.length + ' filas por día · ' + r.detalle.length + ' movimientos';
      pintarPrevia();
      if (despues) despues();
    });
  }
  var pct = function (v) { return v == null ? '—' : Math.round(v * 100) + '%'; };
  var nv = function (v) { return v == null ? '—' : v.toLocaleString('es'); };
  function pintarPrevia() {
    var r = reporte;
    var h = '';

    h += '<div class="previa"><h4>Resumen por agente · ' + esc(r.filtros.desde) + ' a ' + esc(r.filtros.hasta) + '</h4><div class="caja"><div class="desliza"><table><thead><tr>' +
      '<th>Agente</th><th class="num">Días</th><th class="num">Asignados</th><th class="num">Nuevas cons.</th><th class="num">Re-asig.</th><th class="num">Total</th><th class="num">Cerrados</th><th class="num">% Resol.</th>' +
      '<th class="num">Respuestas</th><th class="num">T. resp. prom.</th><th class="num">Mediana</th><th class="num">% en meta</th><th class="num">1ª resp.</th><th class="num">Resolución</th></tr></thead><tbody>' +
      r.porAgente.slice(0, -1).map(filaPrevia).join('') + '</tbody><tfoot>' + filaPrevia(r.porAgente[r.porAgente.length - 1]) + '</tfoot></table></div></div>' +
      '<p class="tenue" style="margin:10px 0 0;font-size:12px">Sincronizado con Help Scout: ' + esc(r.ultimaSincronizacion || 'nunca') +
      ' · historial desde ' + esc(r.fechaInicio) + '. El archivo incluye además el detalle por día, cada movimiento con su enlace y las definiciones.</p></div>';
    $('expPrevia').innerHTML = h;

  function filaPrevia(a) {
    return '<tr><td class="nombre">' + esc(a.agente === 'EQUIPO' ? 'Equipo' : a.agente) + '</td><td class="num">' + a.dias + '</td><td class="num">' + a.asignados + '</td><td class="num">' + a.nuevaConsulta +

      '</td><td class="num">' + (a.resolucionPromH == null ? '—' : nv(a.resolucionPromH) + ' h') + '</td></tr>';

  var NOMBRE_TIPO = { ASIGNADO: 'Asignado', RESPUESTA: 'Respuesta', PRIMERA_RESPUESTA: 'Primera respuesta', NUEVA_CONSULTA: 'Nueva consulta', REASIGNADO: 'Re-asignado', CERRADO: 'Cerrado' };
  function hojas() {
